<style>
[hidden]{display:none!important}
/* Layout: floating glass pill nav over a dark render-led hero, then airy light sections with bento cards; dark footer bookends the page */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#ECEEF2; --ink:#0D1117; --muted:#5A6371; --line:#E1E4EA;
  --accent:#F59E0B; --accent-strong:#B45309; --on-accent:#1A1206; --glow:rgba(245,158,11,.35);
  --night:#0A0E14; --night-2:#121924; --night-line:rgba(255,255,255,.09); --night-ink:#F2F4F7; --night-muted:#A3ACB9;
  --ok:#16A34A; --bad:#DC2626;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Manrope",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r-lg:28px; --r-md:18px; --r-sm:12px; --ease:cubic-bezier(.22,.8,.2,1);
  --shadow:0 1px 2px rgba(13,17,23,.04),0 12px 32px -12px rgba(13,17,23,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D12; --surface:#11161D; --surface-2:#18202A; --ink:#EEF1F5; --muted:#9AA3B1; --line:#232A35;
  --accent:#FBB13C; --accent-strong:#FBB13C; --glow:rgba(251,177,60,.25); --night:#06090D; --night-2:#0F151E;
  --ok:#4ADE80; --bad:#F87171; --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D12; --surface:#11161D; --surface-2:#18202A; --ink:#EEF1F5; --muted:#9AA3B1; --line:#232A35;
  --accent:#FBB13C; --accent-strong:#FBB13C; --glow:rgba(251,177,60,.25); --night:#06090D; --night-2:#0F151E;
  --ok:#4ADE80; --bad:#F87171; --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(40px,6vw,76px);line-height:1.02;font-weight:600}
h2{font-size:clamp(30px,4vw,50px);line-height:1.08;font-weight:600}
h3{font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
.grad{background:linear-gradient(100deg,#FCD34D 0%,#F59E0B 45%,#FB923C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.eyebrow i{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-style:normal;font-size:12px}
.dark .eyebrow{background:rgba(255,255,255,.06);border-color:var(--night-line);color:var(--night-muted)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:clamp(17px,1.4vw,19px);color:var(--muted);max-width:54ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,background .25s,border-color .25s;background:none;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn-accent{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 30px -10px var(--glow)}
.btn-accent:hover{box-shadow:0 16px 40px -10px var(--glow)}
.btn-ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.dark .btn-ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:var(--night-ink)}
.dark .btn-ghost:hover{border-color:rgba(255,255,255,.5)}
.btn .arr{transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
.btn-sm{padding:10px 18px;font-size:14px}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
.nav-shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding-block:14px;margin-bottom:-88px;pointer-events:none}
.nav{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 8px 0 18px;border-radius:999px;background:rgba(12,16,22,.62);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.1);color:#F2F4F7;transition:background .3s,box-shadow .3s}
.nav-shell.scrolled .nav{background:rgba(12,16,22,.86);box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;background:none;border:0;cursor:pointer;padding:0;color:inherit}
.logo .mk{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#FCD34D,#F59E0B 60%,#EA580C);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.logo small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:#A3ACB9;letter-spacing:.02em;margin-top:-3px}
.nav-links{display:flex;gap:2px}
.nav-links a,.nav-links button{padding:9px 14px;border-radius:999px;text-decoration:none;font-size:14.5px;font-weight:600;color:#C9D0DA;background:none;border:0;cursor:pointer;transition:color .2s,background .2s}
.nav-links a:hover,.nav-links button:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-links .on{color:#fff;background:rgba(255,255,255,.12)}
.nav-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer}
.menu-btn{display:none}
@media (max-width:960px){
  .nav-links{display:none;position:absolute;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));top:84px;flex-direction:column;padding:10px;border-radius:24px;background:rgba(12,16,22,.96);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px)}
  .nav-links.open{display:flex}
  .nav-links a,.nav-links button{padding:14px 16px;font-size:16px;text-align:left;border-radius:14px}
  .menu-btn{display:grid}
  .nav-r .btn{display:none}
}

/* dark hero shell */
.dark{background:var(--night);color:var(--night-ink)}
.dark .lead{color:var(--night-muted)}
.dark .mono{color:var(--night-muted)}
.hero{position:relative;overflow:hidden;padding-block:150px 90px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 85% 20%,rgba(245,158,11,.18),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(56,104,160,.22),transparent 60%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center}
.hero h1{margin-top:22px}
.hero .lead{margin-top:22px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.proof{display:flex;align-items:center;gap:14px;margin-top:36px;font-size:14px;color:var(--night-muted)}
.faces{display:flex}
.faces span{width:36px;height:36px;border-radius:50%;border:2px solid var(--night);margin-left:-10px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#1A1206}
.faces span:first-child{margin-left:0}
.proof b{color:#fff}
.stars{color:#FBBF24;letter-spacing:1px}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr;gap:40px}.hero{padding-block:130px 64px}}

/* render frames */
.shot{position:relative;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(110deg,var(--surface-2) 30%,var(--line) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:shim 1.6s linear infinite;max-width:100%}
.dark .shot{background:linear-gradient(110deg,#141B25 30%,#1C2633 50%,#141B25 70%);background-size:300% 100%}
.shot.ready{animation:none;background:var(--surface-2)}
.shot img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);transition:opacity .8s var(--ease),transform 1.2s var(--ease)}
.shot.ready img{opacity:1;transform:none}
@keyframes shim{to{background-position:-150% 0}}
.hero-shot{aspect-ratio:5/4;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.08)}
.chip-float{position:absolute;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#0D1117;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);font-size:13.5px;line-height:1.3;animation:floaty 6s ease-in-out infinite}
.chip-float b{display:block;font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.chip-float .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#0D1117;color:#FBBF24;flex:none}
.chip-float small{color:#5A6371}
@keyframes floaty{50%{transform:translateY(-8px)}}

/* sections */
section{padding-block:110px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px;margin-bottom:56px}
.sec-head .l{max-width:640px;display:grid;gap:16px;justify-items:start}
.sec-head p{color:var(--muted);max-width:44ch}
.center{text-align:center;justify-items:center;margin-inline:auto}
@media (max-width:700px){section{padding-block:80px}.sec-head{margin-bottom:40px}}

/* trust strip */
.strip{border-block:1px solid var(--night-line);background:var(--night);color:var(--night-muted);overflow:hidden}
.strip .track{display:flex;gap:56px;width:max-content;padding-block:22px;animation:mq 36s linear infinite;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.strip span{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.strip span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
@keyframes mq{to{transform:translateX(-50%)}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow)}
.svc-card{position:relative;padding:30px;display:grid;gap:14px;align-content:start;transition:transform .35s var(--ease),border-color .35s,box-shadow .35s;overflow:hidden}
.svc-card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:0 30px 60px -30px var(--glow)}
.svc-card p{color:var(--muted);font-size:15px}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E}
:root[data-theme="dark"] .ico{background:rgba(251,177,60,.14);color:#FBB13C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ico{background:rgba(251,177,60,.14);color:#FBB13C}}
.ico svg{width:24px;height:24px}
.svc-card .more{font-weight:700;font-size:14px;color:var(--accent-strong);display:inline-flex;gap:6px;align-items:center}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{padding:26px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:clamp(34px,3.6vw,48px);font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;color:var(--muted);font-size:14px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}

/* project cards */
.pcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:16px;border-radius:var(--r-md)}
.pcard .shot{aspect-ratio:4/3;border-radius:var(--r-md)}
.pcard .shot img{transition:opacity .8s var(--ease),transform 1s var(--ease)}
.pcard:hover .shot img,.pcard:focus-visible .shot img{transform:scale(1.06)}
.pcard .tag{position:absolute;top:14px;left:14px;z-index:1;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);color:#0D1117;font-size:12px;font-weight:700}
.pcard .open{position:absolute;right:14px;bottom:14px;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transform:scale(.6);opacity:0;transition:all .35s var(--ease)}
.pcard:hover .open,.pcard:focus-visible .open{transform:none;opacity:1}
.pcard .meta{display:flex;justify-content:space-between;align-items:start;gap:12px}
.pcard .meta small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.pcard .meta .yr{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:36px 28px}
@media (max-width:960px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.pgrid{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.chipb:hover{border-color:var(--ink)}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipb .c{font-family:var(--mono);font-size:11px;opacity:.55;margin-left:6px}

/* testimonial */
.quote-card{padding:32px;display:grid;gap:22px;align-content:space-between}
.quote-card blockquote{margin:0;font-family:var(--display);font-size:19px;line-height:1.5;letter-spacing:-.01em;font-weight:500}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1A1206;flex:none}
.who small{display:block;color:var(--muted);font-size:13.5px}

/* cta band */
.cta-band{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:64px;background:var(--night);color:var(--night-ink);display:grid;grid-template-columns:1.3fr auto;gap:32px;align-items:center}
.cta-band::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 100% 0%,rgba(245,158,11,.35),transparent 60%),radial-gradient(500px 300px at 0% 100%,rgba(56,104,160,.3),transparent 60%)}
.cta-band>*{position:relative}
.cta-band p{color:var(--night-muted);margin-top:14px;max-width:48ch}
@media (max-width:800px){.cta-band{grid-template-columns:1fr;padding:40px 28px}}

/* forms */
.field{display:grid;gap:8px;min-width:0}
.field label{font-size:14px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.field .err{font-size:13px;color:var(--bad)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.two{grid-template-columns:1fr}}
.done{display:grid;gap:14px;justify-items:start}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff}

/* contact */
.way{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:transform .3s var(--ease),border-color .3s}
.way:hover{transform:translateY(-3px);border-color:var(--accent)}
.way .ico{width:48px;height:48px;border-radius:14px;flex:none}
.way div{min-width:0}
.way small{display:block;color:var(--muted);font-size:13px}
.way strong{display:block;font-size:17px;word-break:break-word}
.way .go{margin-left:auto;color:var(--muted)}
.map{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:340px;background:#0F1620;border:1px solid var(--line)}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%)}
.map .pin::after{content:"";position:absolute;left:50%;top:100%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:var(--glow);animation:pulse 2.4s ease-out infinite;z-index:-1}
@keyframes pulse{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.4);opacity:0}}
.map .card-on{position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);color:#0D1117}
.map .card-on small{color:#5A6371;display:block}

/* footer */
footer{background:var(--night);color:var(--night-muted);font-size:14.5px;padding-block:80px 32px}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:40px}
footer h4{color:#fff;font-family:var(--body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
footer a,footer button{display:block;color:var(--night-muted);text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left}
footer a:hover,footer button:hover{color:#fff}
.fbase{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid var(--night-line);font-size:13px}
.socials{display:flex;gap:8px;margin-top:20px}
.socials a{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--night-line);color:#fff;padding:0}
.socials a:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:860px){.fgrid{grid-template-columns:1fr 1fr}}

/* floating contact */
.fab{position:fixed;right:max(20px,calc(20px + env(safe-area-inset-right,0px)));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:12px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);text-decoration:none;transition:transform .25s var(--ease)}
.fab a:hover{transform:scale(1.08)}
.fab .m{background:#0866FF;color:#fff}
.fab .c{background:var(--accent);color:var(--on-accent)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow)}

/* motion: content stays visible; only slides into place */
.rv{transition:transform .9s var(--ease)}
.rv.pre{transform:translateY(36px)}

<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* HaligiRender — procedural architectural renders with three.js (r128).

const HR = (() => {
  const T = window.THREE;
  const ok = (() => { try { const c = document.createElement('canvas'); return !!(T && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { return false; } })();
  const lin = h => new T.Color(h).convertSRGBToLinear();
  const MC = {};
  const M = (hex, o = {}) => {
    const k = hex + JSON.stringify(o);
    if (!MC[k]) {

    }

  };
  const P = {
    wall: '#EEEBE5', wall2: '#D8D3CA', dark: '#26292E', slab: '#3A3F46', wood: '#9C6B47', glass: '#7FA3BC',
    concrete: '#B9B5AD', block: '#A9A49B', roof: '#3B4047', roofRed: '#6E3F30', grass: '#5E8541', ground: '#ADA697',

    const gw = (w - 0.8) / n;

  function gable(g, w, d, y, h, color) {

  function frameFloor(g, w, d, y, fh, s, top) {
    const nx = Math.max(2, Math.round(w / 4) + 1), nz = Math.max(2, Math.round(d / 4) + 1);
    const ch = fh * clamp(s * 2, 0.15, 1);
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
      const x = -w / 2 + 0.2 + i * (w - 0.4) / (nx - 1), z = -d / 2 + 0.2 + j * (d - 0.4) / (nz - 1);

      if (top && s < 1) for (let r = 0; r < 4; r++) B(0.04, 0.9, 0.04, M('#5A4A3E'), x - 0.1 + (r % 2) * 0.2, y + ch, z - 0.1 + (r > 1) * 0.2, g);

    }
  }

  function finishedFloor(g, o, i, y) {

      B(w, fh, d, M(i ? P.wall : P.wall2), 0, y, 0, g);
      windowsRow(g, 0, w * 0.8, y, d / 2 + 0.01, fh, Math.max(2, Math.round(w / 3.2)), night);
      windowsRow(g, 0, d * 0.5, y, w / 2 + 0.01, fh, 1, night, true);
      if (i === 0) { B(1.3, fh * 0.75, 0.14, M(P.wood, { r: 0.5 }), 0, y, d / 2 + 0.06, g); B(3.2, 0.18, 1.6, M(P.slab), 0, y + fh * 0.82, d / 2 + 0.8, g); }

      for (let k = 1; k < 5; k++) B(0.12, fh * 0.78, 0.14, M(P.dark), -w / 2 + 0.3 + k * (w - 0.6) / 5, y + 0.1, d / 2 + 0.05, g);
      B(w + 0.4, 0.5, 1.6, M(o.accent || P.accent, { r: 0.5 }), 0, y + fh * 0.86, d / 2 + 0.8, g);
    } else if (type === 'tower') {

      B(w + 0.3, 0.3, d + 0.3, M(P.slab), 0, y, 0, g);
      for (let k = 0; k <= Math.round(w / 2.4); k++) B(0.12, fh, 0.14, M('#5C646D', { m: 0.4, r: 0.4 }), -w / 2 + k * w / Math.round(w / 2.4), y, d / 2 + 0.08, g);
    } else if (type === 'warehouse') {
      B(w, fh, d, M('#D5D8DA', { r: 0.55, m: 0.2 }), 0, y, 0, g);
      for (let k = 0; k < 3; k++) { const x = -w / 2 + 3 + k * 4.6; B(3.6, fh * 0.6, 0.1, M('#6F777F', { m: 0.3, r: 0.5 }), x + 1.8, y, d / 2 + 0.03, g); B(3.6, 0.3, 0.12, M(o.accent || P.accent), x + 1.8, y + fh * 0.6, d / 2 + 0.04, g); }
      windowsRow(g, w / 2 - 5, 8, y + fh * 0.45, d / 2 + 0.01, fh * 0.5, 3, night);
    } else { // apartment / upper floors of shop
      B(w, fh, d, M(i % 2 ? P.wall : '#E4E0D8'), 0, y, 0, g);
      windowsRow(g, 0, w * 0.9, y, d / 2 + 0.01, fh, Math.max(2, Math.round(w / 2.8)), night);
      windowsRow(g, 0, d * 0.6, y, w / 2 + 0.01, fh, 2, night, true);
      B(w + 0.2, 0.22, 1.3, M(P.slab), 0, y - 0.1, d / 2 + 0.6, g);
      B(w * 0.98, 0.9, 0.05, M('#BFD6E4', { r: 0.1, op: 0.35 }), 0, y + 0.1, d / 2 + 1.2, g);
      B(0.4, fh, 0.6, M(o.accent2 || P.wood, { r: 0.6 }), -w / 2 + 0.2, y, d / 2 + 0.3, g);
    }
  }

  function tree(g, x, z, s = 1, c = '#5F8A4E') {
    B(0.3 * s, 1.6 * s, 0.3 * s, M('#6B4F38'), x, 0, z, g);

    B(4.2, 0.8, 1.8, M(c, { r: 0.35, m: 0.4 }), 0, 0.35, 0, cg); B(2.4, 0.7, 1.6, M('#2C3A47', { r: 0.15, m: 0.5 }), -0.2, 1.15, 0, cg);
    [[-1.3, 0.9], [1.3, 0.9], [-1.3, -0.9], [1.3, -0.9]].forEach(([a, b]) => { const wh = new T.Mesh(new T.CylinderGeometry(0.38, 0.38, 0.3, 14), M('#1B1D20')); wh.rotation.x = Math.PI / 2; wh.position.set(a, 0.38, b); cg.add(wh); });

  }
  function crane(g, x, z, H, L) {
    const c = new T.Group(); c.position.set(x, 0, z);
    const y = M(P.accent, { r: 0.5, m: 0.2 });
    for (let k = 0; k < 4; k++) B(0.12, H, 0.12, y, (k % 2 - 0.5) * 0.9, 0, (k > 1 ? 0.45 : -0.45), c);

    B(L, 0.7, 0.7, y, L / 2 - 4, H, 0, c); B(1.6, 1.4, 1.4, M(P.dark), 0, H - 1.4, 0.9, c);

    const hx = L * 0.62; B(0.04, H * 0.42, 0.04, M(P.dark), hx, H - H * 0.42, 0, c); B(0.7, 0.5, 0.5, M(P.accent), hx, H - H * 0.42 - 0.5, 0, c);

    for (let y = 1.8; y < h; y += 2) { B(w + 1.2, 0.08, 0.08, m, 0, y, z, g); B(w + 1.2, 0.08, 0.08, m, 0, y, z + 1.1, g); B(w + 1, 0.06, 1, M(P.wood, { r: 0.9 }), 0, y - 0.1, z + 0.55, g); }
  }

  const norm = o => Object.assign({ type: 'modern', floors: 2, w: 12, d: 9, fh: 3.2, progress: 1, time: 'day', props: true }, o);
  function scene(o) {
    const night = o.time === 'dusk'; o.night = night;

function paintShot(el, opts, W, H) {
  const img = el.querySelector('img') || el.appendChild(document.createElement('img'));
  if (!img.alt) img.alt = el.dataset.alt || '';
  const done = url => { if (url) { img.onload = () => el.classList.add('ready'); img.src = url; } else { el.classList.add('ready', 'fallback'); } };
  if (typeof HR === 'undefined' || !HR.ok) return done(null);
  HR.queue(opts, done, W || 960, H || 720);
}

}

      <div class="side">
        <a class="way" href="tel:${BIZ.tel}"><span class="ico">${I.phone}</span><div><small>Call or text</small><strong>${BIZ.phone}</strong></div><span class="go">${I.arrow}</span></a>
        <a class="way" href="${BIZ.msgr}" target="_blank" rel="noopener"><span class="ico">${I.msg}</span><div><small>Messenger</small><strong>m.me/haligibuilders</strong></div><span class="go">${I.arrow}</span></a>
        <a class="way" href="mailto:${BIZ.email}"><span class="ico">${I.mail}</span><div><small>Email</small><strong>${BIZ.email}</strong></div><span class="go">${I.arrow}</span></a>
        <div class="map" aria-label="Map of the office on Rizal Avenue">${mapSVG()}<div class="card-on"><div><strong>Visit our office</strong><small>${BIZ.hours}</small></div><a class="btn btn-accent btn-sm" href="${BIZ.maps}" target="_blank" rel="noopener">Directions</a></div></div>
      </div>
    </div></section>`
};

/* router */
const view = $('#view');
function go(route, opts = {}) {
  let [name, arg] = route.startsWith('svc-') ? ['svc', route.slice(4)] : [route];
  if (!VIEWS[name]) name = 'home';
  view.innerHTML = `<div class="view">${VIEWS[name](arg ?? opts.svc)}</div>`;
  $$('#links button').forEach(b => b.classList.toggle('on', b.dataset.go === name || (name === 'svc' && b.dataset.go === 'services')));
  scrollTo({ top: 0, behavior: opts.instant ? 'auto' : 'smooth' });
  try { history.replaceState(null, '', '#' + route); } catch (e) { }
  paintAll(view); initReveal(view); countUp(view);
  if (name === 'contact') bindForm();
  // analytics: gtag('event','page_view',{page_title:route})
}
$('#fsvc').innerHTML = SERVICES.map(s => `<button data-go="svc-${s.id}">${s.name}</button>`).join('');
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); if (!lb.hidden) closeLB(true); go(g.dataset.go, { svc: g.dataset.svc }); return; }
  const f = e.target.closest('[data-filter]'); if (f) { $$('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b === f)); const c = f.dataset.filter; $('#pgrid').innerHTML = PROJECTS.slice(0, 9).map((p, i) => [p, i]).filter(([p]) => c === 'All' || p.cat === c).map(([p, i]) => pcard(p, i)).join(''); paintAll($('#pgrid')); return; }
  const p = e.target.closest('[data-proj]'); if (p) openLB(+p.dataset.proj);
});

/* lightbox: three views of each project */
const lb = $('#lb'); let cur = 0, ci = 0, lastFocus;
const VIEWS3 = [['Completed', {}], ['During construction', { progress: .62 }], ['Evening view', { time: 'dusk' }]];
const big = (i, k) => Object.assign({}, PROJECTS[i].r, VIEWS3[k][1], k === 1 && PROJECTS[i].r.progress ? { progress: .4 } : {}, k === 0 && PROJECTS[i].r.progress ? { progress: 1 } : {});
function drawLB() {
  const p = PROJECTS[cur];
  lb.innerHTML = `<div class="lb-in"><div class="lb-media">${shot(big(cur, ci), p.t + ', ' + VIEWS3[ci][0].toLowerCase(), '', 1200, 900)}<button class="lb-arrow prev" data-lb="-1" aria-label="Previous view">‹</button><button class="lb-arrow next" data-lb="1" aria-label="Next view">›</button>
  <div class="thumbs">${VIEWS3.map((v, k) => `<button data-th="${k}" aria-current="${k === ci}">${shot(big(cur, k), '', '', 320, 240)}<span>${v[0]}</span></button>`).join('')}</div></div>
  <div class="lb-info"><button class="x" data-close aria-label="Close">✕</button><span class="mono">${p.cat} · ${VIEWS3[ci][0]}</span><h2 id="lbTitle" style="font-size:32px">${p.t}</h2><p>${p.d}</p>
  <div class="spec" style="position:static;padding:0"><dl style="margin:0">${[['Location', p.loc], ['Floor area', p.area + ' sqm'], ['Duration', p.dur], ['Year', p.yr]].map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl></div>
  <button class="btn btn-accent" data-go="contact" data-svc="${p.svc}">Build something similar <span class="arr">→</span></button></div></div>`;
  paintAll(lb);
}
function openLB(i) { lastFocus = document.activeElement; cur = i; ci = 0; drawLB(); lb.hidden = false; document.body.style.overflow = 'hidden'; $('.x', lb).focus(); }
function closeLB(silent) { lb.hidden = true; document.body.style.overflow = ''; if (!silent && lastFocus && lastFocus.focus) lastFocus.focus(); }
lb.addEventListener('click', e => {
  if (e.target === lb || e.target.closest('[data-close]')) { closeLB(); return; }
  const a = e.target.closest('[data-lb]'); if (a) { ci = (ci + +a.dataset.lb + 3) % 3; drawLB(); return; }
  const t = e.target.closest('[data-th]'); if (t) { ci = +t.dataset.th; drawLB(); }
});
addEventListener('keydown', e => { if (lb.hidden) return; if (e.key === 'Escape') closeLB(); if (e.key === 'ArrowRight') { ci = (ci + 1) % 3; drawLB(); } if (e.key === 'ArrowLeft') { ci = (ci + 2) % 3; drawLB(); } });

/* inquiry form */
function bindForm() {
  const f = $('#inq'); if (!f) return;
  const rules = { 'f-name': v => v.trim().length > 1, 'f-phone': v => /^(\+?63|0)9\d{9}$/.test(v.replace(/[\s-]/g, '')), 'f-email': v => !v || /^\S+@\S+\.\S+$/.test(v), 'f-svc': v => !!v, 'f-msg': v => v.trim().length > 5 };
  const check = id => { const el = $('#' + id), ok = rules[id](el.value), fl = el.closest('.field'); fl.classList.toggle('invalid', !ok); fl.querySelector('.err').hidden = ok; return ok; };
  Object.keys(rules).forEach(id => $('#' + id).addEventListener('blur', () => check(id)));
  f.addEventListener('submit', e => {
    e.preventDefault(); const bad = Object.keys(rules).filter(id => !check(id)); if (bad.length) { $('#' + bad[0]).focus(); return; }
    const name = $('#f-name').value.trim().split(' ')[0].replace(/[<>&"]/g, '');
    // Live site: send to the client's email (Laravel mail / Formspree), then gtag('event','generate_lead')
    f.innerHTML = `<div class="done"><span class="ok">${I.check}</span><h3 style="font-size:26px">Thanks, ${name}. Your inquiry is in.</h3><p style="color:var(--muted)">Our project coordinator will call or text you within one working day to schedule a site visit.</p><button class="btn btn-ghost" type="button" data-go="projects">Browse projects while you wait</button></div>`;
  });
}
initNav();
go((location.hash || '').slice(1) || 'home', { instant: true });
</script>

</body>
</html>
